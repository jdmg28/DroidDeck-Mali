name: Mali-G615 experimental APK (unvalidated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      DROIDDECK_GITHUB_REPOSITORY: Droid-Deck/DroidDeck
      DROIDDECK_BUILD_VARIANT: debug
      DROIDDECK_NDK_VERSION: 27.3.13750724
      # Steam client is the target. Skip optional GOG/Epic/Amazon Rust engines for the first build.
      DROIDDECK_SKIP_RUST: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools  
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd pkg-config gh
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'cmake;3.22.1' 'ndk;27.3.13750724'
      - name: Build the patched app and guest preloads
        run: |
          test -f app/src/main/java/com/droiddeck/launcher/gpu/DriverArchivePolicy.java
          test -f tools/linuxfs/overlay/usr/local/bin/droiddeck-mali-check
          bash tools/build_local.sh
      - name: Upload experimental isolated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidDeck-Mali-G615-experimental-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# This workflow has not been executed by the kit author. It builds code, not proof of phone support.
# Debug application ID: com.droiddeck.launcher.mali.g615, so it can coexist with the official app.
