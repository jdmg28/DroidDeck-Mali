name: GPU guard branch APK

# Builds the GPU-guard work on the arena/** branch so there is something installable to look at.
# Separate from mali-g615-experimental.yml on purpose: that one stays manual, this one runs on every
# push to this branch. Delete this file when the guard work is merged.
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      DROIDDECK_GITHUB_REPOSITORY: Droid-Deck/DroidDeck
      DROIDDECK_BUILD_VARIANT: debug
      DROIDDECK_NDK_VERSION: 27.3.13750724
      DROIDDECK_SKIP_RUST: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd pkg-config gh
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'cmake;3.22.1' 'ndk;27.3.13750724'
      - name: Build the patched app and guest preloads
        id: build
        run: |
          # -e matters more here than it looks: inside a { ... } group the step's status is the LAST
          # command's, so with only pipefail a red test suite in the middle of this block still
          # leaves gradle to decide whether the run is green. Verified locally - a failing first
          # command exits 0 without -e and 1 with it. The "Assert the test suites ran" step below is
          # the belt to this pair of braces.
          set -eo pipefail
          # Everything the step does goes into the log the next step publishes. An earlier run
          # died in one second, before the build, and published "(no build log)": the step that
          # failed was the one nobody could read. pipefail keeps the failure visible as a failure.
          {
            test -f app/src/main/java/com/droiddeck/launcher/gpu/DriverArchivePolicy.java
            test -f tools/linuxfs/overlay/usr/local/bin/droiddeck-mali-check
            test -f tools/linuxfs/overlay/usr/local/bin/droiddeck-gpu-probe
            # Before the app: the probe decides whether Steam may touch the GPU at all, and it has
            # twice shipped broken in ways that only showed up on the phone. It is tested here
            # against a fake loader, which needs no GPU and takes seconds. The headers are cloned
            # because the probe's hand-written structs are then checked against the real Vulkan ABI
            # (tools/test/vulkan_offsets.c) instead of against the mock that has been agreeing with
            # them - a layout wrong by 16 bytes looks perfectly sane and is only fatal on the phone.
            git clone -q --depth 1 https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"
            export VULKAN_INCLUDE_DIR="$RUNNER_TEMP/vkh/include"
            bash tools/test/run_probe_tests.sh
            # And the adapter's own suite: a fake backend that can SIGKILL itself mid-present is the
            # only way to prove the trace survives a dying process with the dying call last.
            bash drivers/mali-g615/test/run_adapter_tests.sh
            # Software mode's two shell suites, both of which run for real here because neither needs
            # a guest: the session script's refusal branch is cut out of droiddeck-session and executed
            # against fixtures (a driver that falls back to the runtime's own ICD is the failure that
            # would otherwise only appear on the phone), and the lavapipe packaging gates are tested on
            # synthetic inputs so a broken gate cannot silently start approving everything.
            bash tools/test/run_software_session_tests.sh
            bash tools/lavapipe/test_lavapipe_tools.sh
            bash tools/build_local.sh
            # The importer's rules (which files it will take, what a companion may be, which vendor a
            # name implies) are plain JVM tests, and they were decoration until this line: nothing else
            # in any workflow has ever compiled or run app/src/test. A driver zip accepted by a policy
            # nobody executed is exactly the kind of "green" that means nothing.
            # The same two properties tools/build_local.sh passes, for the same reason: buildRustStores is
            # in the task graph whatever else is asked for, its only gate is the gradle property
            # -PskipRust (the job's DROIDDECK_SKIP_RUST env var is read by the script, not by gradle), and
            # android.ndkDirectory is resolved at configuration time whether or not the task runs. Without
            # them the unit tests died in five seconds on a Rust task that had nothing to do with them.
            ./gradlew --console=plain :app:testDebugUnitTest --tests '*DriverArchivePolicyTest*' \
              -PskipRust=true "-PndkVersion=${DROIDDECK_NDK_VERSION}"
            echo "importer policy tests passed"
          } 2>&1 | tee /tmp/droiddeck-build.log
      # A green build is not evidence that tests ran; it is evidence that gradle succeeded. The
      # suites above print their own verdicts, so their verdicts are looked for here, in the log the
      # step wrote, and this run goes red if one of them ever stops being reached.
      - name: Assert the test suites ran
        run: |
          set -e
          for marker in 'all probe cases passed' 'declarations checked' 'all adapter cases passed' \
                       'all software-mode session cases passed' 'lavapipe tool tests passed' \
                       'importer policy tests passed'; do
            if grep -q "$marker" /tmp/droiddeck-build.log; then
              echo "ran: $marker"
            else
              echo "missing from the build log: $marker"
              echo "the suite did not run, or failed before printing its verdict"
              exit 1
            fi
          done

      # The machine working on this branch cannot download Actions logs, only talk to the API, so
      # on failure the log is published as a check run where it can be read back.
      - name: Publish the build log
        if: always() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$GITHUB_RUN_ID" <<'PY' > /tmp/checkrun.json
          import json, sys
          run_id = sys.argv[1]
          try:
              log = open('/tmp/droiddeck-build.log', encoding='utf-8', errors='replace').read()
          except OSError:
              log = '(no build log)'
          lines = log.splitlines()
          keep = [l for l in lines if ('error:' in l or l.startswith('e: ') or 'FAILURE' in l
                   or 'What went wrong' in l or 'FAILED' in l)][:250]
          body = "\n".join(lines[-400:]) + "\n\n--- error lines ---\n" + "\n".join(keep)
          print(json.dumps({
              "name": "build log",
              "head_sha": "${{ github.sha }}",
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "Build log, run %s" % run_id,
                         "summary": body[:65000]},
          }))
          PY
          gh api -X POST "/repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/checkrun.json -q .html_url
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidDeck-GPU-Guard-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # An artifact download is always a .zip, and "there was a problem parsing the package" is
      # what Android says when it is handed one. A release asset downloads as a raw .apk. The
      # same step prints everything needed to tell a bad download from a bad package.
      - name: Publish a raw APK and describe it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Two pushes in quick succession are two runs, and the older one can finish last - it then
          # overwrites the release pointer with an APK from a superseded commit, which is a confusing way
          # to be technically correct. This happened: the notes cited the previous commit while the patch
          # zip carried the next one. A successful run cannot be re-run through the API to fix a pointer
          # afterwards, so the run decides for itself whether it still owns the tag.
          BRANCH=${{ github.ref_name }}
          THIS=${{ github.sha }}
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/$BRANCH" -q .sha)
          if [ "$HEAD_SHA" != "$THIS" ]; then
            echo "superseded: $BRANCH is at ${HEAD_SHA:0:7} and this run built ${THIS:0:7}."
            echo "The gpu-guard-latest pointer is left where it is; the newer run publishes its own APK."
            exit 0
          fi
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "== file: $APK"
          ls -l "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null && echo "== zip integrity: OK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -6 || true
          python3 - "$APK" <<'PY'
          import struct, sys, zipfile
          apk = zipfile.ZipFile(sys.argv[1])
          bad = []
          for name in apk.namelist():
              if not name.endswith(".so"):
                  continue
              data = apk.read(name)[:64]
              if data[:4] != b"\x7fELF":
                  continue
              is64 = data[4] == 2
              e_phoff = struct.unpack_from("<Q", data, 0x20)[0]
              e_phentsize, e_phnum = struct.unpack_from("<HH", data, 0x36)
              head = apk.read(name)[e_phoff:e_phoff + e_phentsize * e_phnum]
              align = 0
              for i in range(e_phnum):
                  off = i * (56 if is64 else 32)
                  p_type = struct.unpack_from("<I", head, off)[0]
                  if p_type != 1:          # PT_LOAD
                      continue
                  p_align = struct.unpack_from("<Q", head, off + (48 if is64 else 28))[0]
                  align = max(align, p_align)
              if align and align < 16384:
                  bad.append("%s (p_align %d)" % (name, align))
          print("== 16 KB page alignment: " +
                ("all libraries are 16 KB aligned" if not bad
                 else "NOT aligned, a 16 KB-page device will refuse these: " + ", ".join(bad)))
          PY
          cp "$APK" DroidDeck-GPU-Guard-debug.apk
          gh release delete gpu-guard-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create gpu-guard-latest DroidDeck-GPU-Guard-debug.apk \
            --prerelease \
            --title "DroidDeck GPU guard - experimental debug build" \
            --notes "Debug build of jdmg28/DroidDeck-Mali-G615, branch ${{ github.ref_name }}, commit ${{ github.sha }}, workflow run ${{ github.run_id }}.

          Application id com.droiddeck.launcher.mali.g615, so it installs beside the official app.
          Experimental: it exists to keep the phone from rebooting while the Mali driver is being
          debugged, not to make games run. See docs/gpu-safety.md in the tree."
