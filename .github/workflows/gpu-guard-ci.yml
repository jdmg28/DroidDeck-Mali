name: GPU guard branch APK

# Builds the GPU-guard work on the arena/** branch so there is something installable to look at.
# Separate from mali-g615-experimental.yml on purpose: that one stays manual, this one runs on every
# push to this branch. Delete this file when the guard work is merged.
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      DROIDDECK_GITHUB_REPOSITORY: Droid-Deck/DroidDeck
      DROIDDECK_BUILD_VARIANT: debug
      DROIDDECK_NDK_VERSION: 27.3.13750724
      DROIDDECK_SKIP_RUST: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd pkg-config gh
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'cmake;3.22.1' 'ndk;27.3.13750724'
      - name: Build the patched app and guest preloads
        id: build
        run: |
          set -o pipefail
          test -f app/src/main/java/com/droiddeck/launcher/gpu/DriverArchivePolicy.java
          test -f tools/linuxfs/overlay/usr/local/bin/droiddeck-mali-check
          test -f tools/linuxfs/overlay/usr/local/bin/droiddeck-gpu-probe
          bash tools/build_local.sh 2>&1 | tee /tmp/droiddeck-build.log
      # The machine working on this branch cannot download Actions logs, only talk to the API, so
      # on failure the log is published as a check run where it can be read back.
      - name: Publish the build log
        if: always() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$GITHUB_RUN_ID" <<'PY' > /tmp/checkrun.json
          import json, sys
          run_id = sys.argv[1]
          try:
              log = open('/tmp/droiddeck-build.log', encoding='utf-8', errors='replace').read()
          except OSError:
              log = '(no build log)'
          lines = log.splitlines()
          keep = [l for l in lines if ('error:' in l or l.startswith('e: ') or 'FAILURE' in l
                   or 'What went wrong' in l or 'FAILED' in l)][:250]
          body = "\n".join(lines[-400:]) + "\n\n--- error lines ---\n" + "\n".join(keep)
          print(json.dumps({
              "name": "build log",
              "head_sha": "${{ github.sha }}",
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "Build log, run %s" % run_id,
                         "summary": body[:65000]},
          }))
          PY
          gh api -X POST "/repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/checkrun.json -q .html_url
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidDeck-GPU-Guard-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
