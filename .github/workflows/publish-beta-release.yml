name: Publish Beta Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        default: v0.4.0-beta.1
        required: true
      title:
        description: Release title
        default: 'DroidDeck-Mali v0.4.0-beta.1 (Build 45) — Beta'
        required: true
      notes_path:
        description: Release notes file (in repo)
        default: docs/releases/v0.4.0-beta.1.md
        required: true
      apk_source_tag:
        description: Tag to take the APK from
        default: software-mode-latest
        required: true
      expected_sha:
        description: Commit the APK must have been built from (empty = this workflow commit)
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: publish-beta-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  APK_ASSET: DroidDeck-Mali-G615-debug.apk
  PANVK_SOURCE_TAG: mali-panvk-latest
  PANVK_UNIVERSAL: DroidDeck-Mali-CSF-PanVK-kbase-universal.zip
  PANVK_RC3EXACTBC: DroidDeck-Mali-CSF-PanVK-kbase-rc3-exactbc.zip
  LAVAPIPE_SOURCE_TAG: software-mode-lavapipe
  LAVAPIPE_ASSET: DroidDeck-Software-Vulkan-lavapipe.zip

jobs:
  publish:
    name: Assemble and publish the beta release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Collect assets
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release-assets"
          rm -rf "$work"
          mkdir -p "$work"

          expected="${{ inputs.expected_sha }}"
          [ -n "$expected" ] || expected="$GITHUB_SHA"

          echo "Checking that $APK_ASSET in ${{ inputs.apk_source_tag }} was built from $expected..."
          body="$(gh release view "${{ inputs.apk_source_tag }}" -R "$GITHUB_REPOSITORY" --json body --jq .body)"
          built="$(printf '%s' "$body" | grep -o 'from `[0-9a-f]\{40\}`' | grep -o '[0-9a-f]\{40\}' | tail -1)"
          if [ -z "$built" ]; then
            echo "::error::Could not find the source commit in the ${{ inputs.apk_source_tag }} release body."
            exit 1
          fi
          if [ "$built" != "$expected" ]; then
            echo "::error::$APK_ASSET was built from $built, not from $expected. Wait for the build of this commit to publish and dispatch again."
            exit 1
          fi

          echo "Downloading $APK_ASSET..."
          gh release download "${{ inputs.apk_source_tag }}" -R "$GITHUB_REPOSITORY" -p "$APK_ASSET" -p "$APK_ASSET.sha256" -D "$work"
          (cd "$work" && sha256sum -c "$APK_ASSET.sha256")

          echo "Downloading PanVK driver packages from $PANVK_SOURCE_TAG..."
          gh release download "$PANVK_SOURCE_TAG" -R "$GITHUB_REPOSITORY" \
            -p "$PANVK_UNIVERSAL" -p "$PANVK_UNIVERSAL.sha256" \
            -p "$PANVK_RC3EXACTBC" -p "$PANVK_RC3EXACTBC.sha256" \
            -D "$work"
          (cd "$work" && sha256sum -c "$PANVK_UNIVERSAL.sha256" "$PANVK_RC3EXACTBC.sha256")

          echo "Downloading $LAVAPIPE_ASSET from $LAVAPIPE_SOURCE_TAG..."
          gh release download "$LAVAPIPE_SOURCE_TAG" -R "$GITHUB_REPOSITORY" -p "$LAVAPIPE_ASSET" -D "$work"

          echo "Gallery images from the repo..."
          for img in karlson.jpg hollow-knight.jpg hollow-knight-menu.jpg miside.jpg miside-menu.jpg craft-sell-mando.jpg dark-souls-menu.jpg; do
            cp "docs/screenshots/release/$img" "$work/"
          done

          (cd "$work" && sha256sum "$APK_ASSET" "$PANVK_UNIVERSAL" "$PANVK_RC3EXACTBC" "$LAVAPIPE_ASSET" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create the beta release
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release-assets"
          tag="${{ inputs.tag }}"
          title="${{ inputs.title }}"

          args=("$work/$APK_ASSET" "$work/$APK_ASSET.sha256" \
                "$work/$PANVK_UNIVERSAL" "$work/$PANVK_RC3EXACTBC" \
                "$work/$LAVAPIPE_ASSET" "$work/SHA256SUMS.txt")
          for img in karlson.jpg hollow-knight.jpg hollow-knight-menu.jpg miside.jpg miside-menu.jpg craft-sell-mando.jpg dark-souls-menu.jpg; do
            args+=("$work/$img")
          done

          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber "${args[@]}"
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "${{ inputs.notes_path }}" \
              --prerelease
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" "${args[@]}" \
              --title "$title" \
              --notes-file "${{ inputs.notes_path }}" \
              --prerelease
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json name,isPrerelease,assets \
            --jq '{name, isPrerelease, assets: [.assets[].name]}'
