# Publishes the official-but-beta GitHub release from the current arena branch.
# Dispatch: workflow file must be dispatched with --ref pointing at a branch that has this file.
# The APK is taken from the rolling software-mode-latest release; a guard file pins the
# commit it must have been built from: docs/releases/<tag>.apk-sha
name: Publish Beta Release (Mali-G615)

on:
  push:
    branches: [ mali-g615-experimental, DroidDeck-mali-experimental, 'arena/**' ]
    paths:
      - .github/workflows/publish-experimental-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        default: v0.4.0-beta.1
        required: true

permissions:
  contents: write

concurrency:
  group: publish-experimental-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE_TAG: ${{ inputs.tag || 'v0.4.0-beta.1' }}
  APK_SOURCE_TAG: software-mode-latest
  APK_ASSET: DroidDeck-Mali-G615-debug.apk
  PANVK_SOURCE_TAG: mali-panvk-latest
  PANVK_UNIVERSAL: DroidDeck-Mali-CSF-PanVK-kbase-universal.zip
  PANVK_RC3EXACTBC: DroidDeck-Mali-CSF-PanVK-kbase-rc3-exactbc.zip
  LAVAPIPE_SOURCE_TAG: software-mode-lavapipe
  LAVAPIPE_ASSET: DroidDeck-Software-Vulkan-lavapipe.zip
  GALLERY: karlson.jpg hollow-knight.jpg hollow-knight-menu.jpg miside.jpg miside-menu.jpg craft-sell-mando.jpg dark-souls-menu.jpg

jobs:
  publish:
    name: Assemble and publish the beta release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download and verify the APK and the standalone driver ZIPs
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release-assets"
          rm -rf "$work"
          mkdir -p "$work"

          expected="$(cat "docs/releases/$RELEASE_TAG.apk-sha")"
          echo "Checking that $APK_ASSET in $APK_SOURCE_TAG was built from $expected..."
          body="$(gh release view "$APK_SOURCE_TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body)"
          built="$(printf '%s' "$body" | grep -o 'from `[0-9a-f]\{40\}`' | grep -o '[0-9a-f]\{40\}' | tail -1)"
          if [ -z "$built" ]; then
            echo "::error::Could not find the source commit in the $APK_SOURCE_TAG release body."
            exit 1
          fi
          if [ "$built" != "$expected" ]; then
            echo "::error::$APK_ASSET was built from $built, but $RELEASE_TAG expects $expected."
            exit 1
          fi

          echo "Downloading $APK_ASSET..."
          gh release download "$APK_SOURCE_TAG" -R "$GITHUB_REPOSITORY" \
            -p "$APK_ASSET" -p "$APK_ASSET.sha256" -D "$work"
          (cd "$work" && sha256sum -c "$APK_ASSET.sha256")

          echo "Downloading the PanVK driver packages from $PANVK_SOURCE_TAG..."
          gh release download "$PANVK_SOURCE_TAG" -R "$GITHUB_REPOSITORY" \
            -p "$PANVK_UNIVERSAL" -p "$PANVK_UNIVERSAL.sha256" \
            -p "$PANVK_RC3EXACTBC" -p "$PANVK_RC3EXACTBC.sha256" \
            -D "$work"
          (cd "$work" && sha256sum -c "$PANVK_UNIVERSAL.sha256" "$PANVK_RC3EXACTBC.sha256")

          echo "Downloading $LAVAPIPE_ASSET from $LAVAPIPE_SOURCE_TAG..."
          gh release download "$LAVAPIPE_SOURCE_TAG" -R "$GITHUB_REPOSITORY" \
            -p "$LAVAPIPE_ASSET" -D "$work"

          echo "Gallery images from the repo..."
          for img in $GALLERY; do
            cp "docs/screenshots/release/$img" "$work/"
          done

          (cd "$work" && sha256sum "$APK_ASSET" "$PANVK_UNIVERSAL" "$PANVK_RC3EXACTBC" "$LAVAPIPE_ASSET" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create or update the beta release
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release-assets"
          title="DroidDeck-Mali v0.4.0-beta.1 (Build 45) — Beta"

          args=("$work/$APK_ASSET" "$work/$APK_ASSET.sha256" \
                "$work/$PANVK_UNIVERSAL" "$work/$PANVK_RC3EXACTBC" \
                "$work/$LAVAPIPE_ASSET" "$work/SHA256SUMS.txt")
          for img in $GALLERY; do
            args+=("$work/$img")
          done

          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber "${args[@]}"
            gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "docs/releases/$RELEASE_TAG.md" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "${args[@]}" \
              --title "$title" \
              --notes-file "docs/releases/$RELEASE_TAG.md" \
              --prerelease
          fi
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json name,isPrerelease,assets \
            --jq '{name, isPrerelease, assets: [.assets[].name]}'
